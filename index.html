<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bhargav School | Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        /* LOGIN CONTAINER */

        .login-container {
            width: 100%;
            max-width: 440px;

            background: white;

            border-radius: 20px;

            padding: 40px 35px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.25);
        }

        /* SCHOOL HEADER */

        .school-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .school-logo {
            width: 80px;
            height: 80px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #1e3a8a;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
            font-weight: bold;
        }

        .school-header h1 {
            color: #0f172a;
            font-size: 25px;
            letter-spacing: 1px;
        }

        .school-header p {
            margin-top: 6px;
            color: #64748b;
            font-size: 13px;
        }

        .tagline {
            margin-top: 10px;

            font-size: 12px;

            font-weight: bold;

            color: #1e3a8a;

            letter-spacing: 1px;
        }

        /* LOGIN TITLE */

        .login-title {
            margin-bottom: 20px;
        }

        .login-title h2 {
            color: #1e293b;
            font-size: 22px;
        }

        .login-title p {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-size: 13px;

            font-weight: bold;

            color: #475569;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.1);
        }

        /* PASSWORD */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #2563eb;

            font-size: 12px;

            cursor: pointer;

            font-weight: bold;
        }

        /* LOGIN BUTTON */

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #1e3a8a;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #172554;
        }

        .login-button:disabled {
            background: #94a3b8;

            cursor: not-allowed;
        }

        /* MESSAGE */

        #message {
            text-align: center;

            margin-top: 18px;

            font-size: 13px;

            min-height: 20px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;
        }

        .footer p {
            color: #94a3b8;

            font-size: 11px;

            line-height: 1.6;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .login-container {
                padding: 30px 22px;
            }

            .school-header h1 {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- SCHOOL HEADER -->

    <div class="school-header">

        <div class="school-logo">
            BS
        </div>

        <h1>
            BHARGAV SCHOOL
        </h1>

        <p>
            Management & Learning Portal
        </p>

        <div class="tagline">
            EDUCATE • EMPOWER • EXCEL
        </div>

    </div>


    <!-- LOGIN TITLE -->

    <div class="login-title">

        <h2>
            Welcome Back
        </h2>

        <p>
            Login to access your school portal.
        </p>

    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    id="showPassword">

                    Show

                </button>

            </div>

        </div>


        <button
            type="submit"
            class="login-button"
            id="loginButton">

            Login

        </button>


    </form>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- FOOTER -->

    <div class="footer">

        <p>
            © 2026 Bhargav School
        </p>

        <p>
            Secure School Management Portal
        </p>

    </div>


</div>


<script>


/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
    "https://jmdujouzsiiwvrsnwawv.supabase.co";


const SUPABASE_KEY =
    "sb_publishable__sdosuGSmD9Lz29D4CG3YA_-8hOYoVn";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


const showPassword =
    document.getElementById(
        "showPassword"
    );


/* =====================================================
   SHOW / HIDE PASSWORD
   ===================================================== */

showPassword.addEventListener(
    "click",
    function() {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            showPassword.textContent =
                "Hide";

        } else {

            passwordInput.type =
                "password";

            showPassword.textContent =
                "Show";

        }

    }
);


/* =====================================================
   MESSAGE FUNCTION
   ===================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        type;

}


/* =====================================================
   REDIRECT USER
   ===================================================== */

function redirectUser(
    role
) {

    role =
        String(role || "")
            .toLowerCase()
            .trim();


    /* MANAGEMENT */

    if (
        role ===
        "management"
    ) {

        window.location.href =
            "dashboard.html";

        return;

    }


    /* TEACHER */

    if (
        role ===
        "teacher"
    ) {

        window.location.href =
            "teacher-dashboard.html";

        return;

    }


    /* STUDENT */

    if (
        role ===
        "student"
    ) {

        window.location.href =
            "student-dashboard.html";

        return;

    }


    /* UNKNOWN ROLE */

    showMessage(
        "Your account does not have a valid portal role. Please contact school management.",
        "error"
    );

}


/* =====================================================
   LOGIN
   ===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if (
            !email ||
            !password
        ) {

            showMessage(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        /* BUTTON LOADING */

        loginButton.disabled =
            true;

        loginButton.textContent =
            "Logging in...";


        showMessage(
            "",
            ""
        );


        try {


            /* =========================================
               SUPABASE AUTH LOGIN
               ========================================= */

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


            /* LOGIN ERROR */

            if (error) {

                showMessage(
                    error.message ||
                    "Login failed. Please check your credentials.",
                    "error"
                );

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

                return;

            }


            /* =========================================
               CHECK SESSION
               ========================================= */

            if (
                !data ||
                !data.user
            ) {

                showMessage(
                    "Unable to create login session.",
                    "error"
                );

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

                return;

            }


            const userId =
                data.user.id;


            /* =========================================
               GET USER ROLE
               ========================================= */

            const {
                data: roleData,
                error: roleError
            } =
                await supabaseClient

                    .from(
                        "user_roles"
                    )

                    .select(
                        "role"
                    )

                    .eq(
                        "user_id",
                        userId
                    )

                    .maybeSingle();


            if (
                roleError
            ) {

                console.error(
                    roleError
                );


                await supabaseClient
                    .auth
                    .signOut();


                showMessage(
                    "Unable to verify your account role. Please contact management.",
                    "error"
                );


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

                return;

            }


            if (
                !roleData ||
                !roleData.role
            ) {

                await supabaseClient
                    .auth
                    .signOut();


                showMessage(
                    "No portal role is assigned to this account. Please contact school management.",
                    "error"
                );


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

                return;

            }


            /* =========================================
               SUCCESS
               ========================================= */

            showMessage(
                "Login successful. Opening your portal...",
                "success"
            );


            setTimeout(
                function() {

                    redirectUser(
                        roleData.role
                    );

                },
                500
            );


        } catch (
            error
        ) {

            console.error(
                error
            );


            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }
);


/* =====================================================
   CHECK IF ALREADY LOGGED IN
   ===================================================== */

async function checkExistingSession() {

    try {

        const {
            data
        } =
            await supabaseClient
                .auth
                .getSession();


        const session =
            data.session;


        if (
            !session
        ) {

            return;

        }


        /* =============================================
           GET EXISTING USER ROLE
           ============================================= */

        const {
            data: roleData,
            error
        } =
            await supabaseClient

                .from(
                    "user_roles"
                )

                .select(
                    "role"
                )

                .eq(
                    "user_id",
                    session.user.id
                )

                .maybeSingle();


        if (
            error ||
            !roleData
        ) {

            return;

        }


        redirectUser(
            roleData.role
        );

    } catch (
        error
    ) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

checkExistingSession();


</script>

</body>

</html>
