<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bhargav School | Management Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(135deg, #0f172a, #1e3a8a);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 42px;
            border-radius: 22px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.30);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #1e3a8a;
            font-size: 27px;
            letter-spacing: 1px;
        }

        .logo p {
            color: #64748b;
            margin-top: 7px;
            font-size: 14px;
        }

        .portal-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #111827;
            font-size: 23px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #172554;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            min-height: 20px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 22px;
            }

            .logo h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">

        <div class="portal-icon">
            🏫
        </div>

        <h1>BHARGAV SCHOOL</h1>

        <p>Educate • Empower • Excel</p>

    </div>

    <h2>Management Login</h2>

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter management email"
                autocomplete="username"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="footer">
        © 2026 Bhargav School • Management Portal
    </div>

</div>


<script>

    /* =====================================================
       SUPABASE CONNECTION
       ===================================================== */

    const SUPABASE_URL = "https://supabase.com/dashboard/project/jmdujouzsiiwvrsnwawv/settings/api-keys";

    const SUPABASE_KEY = "sb_publishable__sdosuGSmD9Lz29D4CG3YA_-8hOYoVn";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =====================================================
       LOGIN
       ===================================================== */

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.textContent = "";
        message.className = "";

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";


        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        try {

            /* Login through Supabase */

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                throw error;

            }


            const user = data.user;


            if (!user) {

                throw new Error(
                    "Unable to identify the user."
                );

            }


            /* Check the user's role */

            const { data: roleData, error: roleError } =
                await supabaseClient

                    .from("user_roles")

                    .select("role")

                    .eq("user_id", user.id)

                    .single();


            if (roleError) {

                await supabaseClient.auth.signOut();

                throw new Error(
                    "Your account does not have a management role."
                );

            }


            if (roleData.role !== "management") {

                await supabaseClient.auth.signOut();

                throw new Error(
                    "Access denied. This account is not a Management account."
                );

            }


            /* Successful login */

            message.textContent =
                "Login successful. Opening Management Portal...";

            message.className = "success";


            /*
             * Dashboard will be created next.
             * For now we use dashboard.html.
             */

            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 800);


        } catch (error) {

            console.error(error);

            message.textContent =
                error.message || "Login failed.";

            message.className = "error";

            loginButton.disabled = false;

            loginButton.textContent = "Login";

        }

    });

</script>

</body>
</html>
