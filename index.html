<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bhargav School | Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .login-container {

            width: 100%;

            max-width: 430px;

        }


        .login-card {

            background: white;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.25);

        }


        .logo {

            width: 75px;

            height: 75px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #1e3a8a;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            font-weight: bold;

        }


        .school-name {

            text-align: center;

            color: #0f172a;

            font-size: 24px;

            font-weight: bold;

            letter-spacing: 1px;

        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            margin-top: 6px;

            margin-bottom: 28px;

        }


        .role-buttons {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-bottom: 22px;

        }


        .role-button {

            border: 1px solid #cbd5e1;

            background: #f8fafc;

            color: #475569;

            padding: 11px 5px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            font-size: 12px;

        }


        .role-button.active {

            background: #1e3a8a;

            color: white;

            border-color: #1e3a8a;

        }


        .form-group {

            margin-bottom: 17px;

        }


        label {

            display: block;

            color: #334155;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,0.1);

        }


        .login-button {

            width: 100%;

            border: none;

            background: #1e3a8a;

            color: white;

            padding: 14px;

            border-radius: 9px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

        }


        .login-button:hover {

            background: #172554;

        }


        .login-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        #message {

            text-align: center;

            margin-top: 16px;

            min-height: 20px;

            font-size: 13px;

            font-weight: bold;

        }


        .footer {

            text-align: center;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 11px;

        }


        @media (max-width: 450px) {

            .login-card {

                padding: 25px 20px;

            }

            .school-name {

                font-size: 21px;

            }

            .role-button {

                font-size: 11px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">
            BS
        </div>


        <div class="school-name">
            BHARGAV SCHOOL
        </div>


        <div class="subtitle">
            Management & School Portal
        </div>


        <!-- ROLE -->

        <div class="role-buttons">


            <button
                type="button"
                class="role-button active"
                data-role="management">

                👨‍💼 Management

            </button>


            <button
                type="button"
                class="role-button"
                data-role="teacher">

                👩‍🏫 Teacher

            </button>


            <button
                type="button"
                class="role-button"
                data-role="student">

                👨‍🎓 Student

            </button>


        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <div class="form-group">


                <label id="loginLabel">
                    Email
                </label>


                <input
                    type="text"
                    id="loginId"
                    placeholder="Enter management email"
                    autocomplete="username"
                    required
                >


            </div>


            <div class="form-group">


                <label>
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >


            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton">

                Login

            </button>


        </form>


        <div id="message"></div>


        <div class="footer">

            Bhargav School © 2026

        </div>


    </div>

</div>


<script>


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
    "https://jmdujouzsiiwvrsnwawv.supabase.co";


const SUPABASE_KEY =
    "sb_publishable__sdosuGSmD9Lz29D4CG3YA_-8hOYoVn";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginId =
    document.getElementById(
        "loginId"
    );


const password =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginLabel =
    document.getElementById(
        "loginLabel"
    );


const message =
    document.getElementById(
        "message"
    );


const roleButtons =
    document.querySelectorAll(
        ".role-button"
    );


let selectedRole =
    "management";


/* =====================================================
   ROLE SELECTION
   ===================================================== */

roleButtons.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            roleButtons.forEach(
                item =>
                    item.classList.remove(
                        "active"
                    )
            );


            this.classList.add(
                "active"
            );


            selectedRole =
                this.dataset.role;


            updateLoginForm();

        }
    );

});


/* =====================================================
   UPDATE FORM
   ===================================================== */

function updateLoginForm() {

    if (
        selectedRole ===
        "management"
    ) {

        loginLabel.textContent =
            "Email";

        loginId.placeholder =
            "Enter management email";

        loginId.type =
            "email";

    }


    else if (
        selectedRole ===
        "teacher"
    ) {

        loginLabel.textContent =
            "Teacher ID";

        loginId.placeholder =
            "Example: TCH001";

        loginId.type =
            "text";

    }


    else {

        loginLabel.textContent =
            "Student ID";

        loginId.placeholder =
            "Example: STU001";

        loginId.type =
            "text";

    }


    loginId.value =
        "";

    password.value =
        "";

    clearMessage();

}


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(
    text,
    type = "error"
) {

    message.textContent =
        text;


    if (type === "success") {

        message.style.color =
            "#15803d";

    } else {

        message.style.color =
            "#dc2626";

    }

}


function clearMessage() {

    message.textContent =
        "";

}


/* =====================================================
   REDIRECT
   ===================================================== */

function redirectByRole(role) {

    if (
        role ===
        "management"
    ) {

        window.location.href =
            "dashboard.html";

        return;

    }


    if (
        role ===
        "teacher"
    ) {

        window.location.href =
            "teacher-dashboard.html";

        return;

    }


    if (
        role ===
        "student"
    ) {

        window.location.href =
            "student-dashboard.html";

        return;

    }


    window.location.href =
        "index.html";

}


/* =====================================================
   MANAGEMENT LOGIN
   ===================================================== */

async function managementLogin(
    email,
    userPassword
) {

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signInWithPassword({

                email:
                    email,

                password:
                    userPassword

            });


    if (error) {

        throw new Error(
            error.message
        );

    }


    if (!data.session) {

        throw new Error(
            "Unable to create login session."
        );

    }


    const {
        data: roleData,
        error: roleError
    } =
        await supabaseClient

            .from(
                "user_roles"
            )

            .select(
                "role"
            )

            .eq(
                "user_id",
                data.user.id
            )

            .single();


    if (
        roleError ||
        !roleData
    ) {

        await supabaseClient
            .auth
            .signOut();

        throw new Error(
            "Management role was not found."
        );

    }


    if (
        roleData.role !==
        "management"
    ) {

        await supabaseClient
            .auth
            .signOut();

        throw new Error(
            "This account is not a management account."
        );

    }


    return true;

}


/* =====================================================
   TEACHER / STUDENT LOGIN
   ===================================================== */

/*
   These two login types use a Supabase Edge Function.

   Function name:

   login-with-id

   The function will:
   1. Receive teacher/student ID + password
   2. Find the account
   3. Authenticate securely
   4. Return a Supabase session
*/


async function idLogin(
    userId,
    userPassword,
    role
) {

    const {
        data,
        error
    } =
        await supabaseClient
            .functions
            .invoke(
                "login-with-id",
                {
                    body: {

                        login_id:
                            userId,

                        password:
                            userPassword,

                        role:
                            role

                    }

                }
            );


    if (error) {

        throw new Error(
            error.message ||
            "Login request failed."
        );

    }


    if (
        !data ||
        !data.access_token ||
        !data.refresh_token
    ) {

        throw new Error(
            data?.error ||
            "Invalid login response."
        );

    }


    const {
        error: sessionError
    } =
        await supabaseClient
            .auth
            .setSession({

                access_token:
                    data.access_token,

                refresh_token:
                    data.refresh_token

            });


    if (sessionError) {

        throw new Error(
            sessionError.message
        );

    }


    return true;

}


/* =====================================================
   LOGIN
   ===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        clearMessage();


        const identifier =
            loginId.value
                .trim();


        const userPassword =
            password.value;


        if (!identifier) {

            showMessage(
                "Please enter your login ID."
            );

            return;

        }


        if (!userPassword) {

            showMessage(
                "Please enter your password."
            );

            return;

        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "Signing in...";


        try {


            if (
                selectedRole ===
                "management"
            ) {

                await managementLogin(
                    identifier,
                    userPassword
                );

            }


            else {

                await idLogin(
                    identifier,
                    userPassword,
                    selectedRole
                );

            }


            showMessage(
                "Login successful. Redirecting...",
                "success"
            );


            setTimeout(
                function() {

                    redirectByRole(
                        selectedRole
                    );

                },
                500
            );


        }

        catch(error) {

            console.error(
                error
            );


            showMessage(
                error.message ||
                "Login failed."
            );


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    });


/* =====================================================
   CHECK EXISTING SESSION
   ===================================================== */

async function checkExistingSession() {

    const {
        data
    } =
        await supabaseClient
            .auth
            .getSession();


    if (
        !data ||
        !data.session
    ) {

        return;

    }


    const user =
        data.session.user;


    const {
        data: roleData
    } =
        await supabaseClient

            .from(
                "user_roles"
            )

            .select(
                "role"
            )

            .eq(
                "user_id",
                user.id
            )

            .maybeSingle();


    if (
        roleData &&
        roleData.role
    ) {

        redirectByRole(
            roleData.role
        );

    }

}


/* =====================================================
   START
   ===================================================== */

updateLoginForm();

checkExistingSession();

</script>

</body>

</html>
